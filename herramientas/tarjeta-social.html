<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="css/site.css">
<style>
  html,body{margin:0;padding:0;width:1200px;height:630px;overflow:hidden}
  .card{position:relative;width:1200px;height:630px;display:grid;grid-template-columns:1fr 468px;background:var(--crema)}
  .txt{padding:56px 40px 104px 68px;display:flex;flex-direction:column;justify-content:center;gap:22px}
  .txt img{width:300px;height:auto;display:block}
  .txt h1{font-family:"Baloo 2",cursive;font-size:57px;line-height:1.04;color:var(--tinta);font-weight:700;letter-spacing:-.5px}
  .txt h1 em{font-style:normal;color:var(--rosa-sombra)}
  .sub{font-family:"Nunito",sans-serif;font-size:25px;color:var(--suave);line-height:1.45;font-weight:600;max-width:24ch}
  .chips{display:flex;gap:9px;flex-wrap:nowrap}
  .chip{font-family:"Nunito",sans-serif;font-size:16px;font-weight:700;color:var(--tinta);background:var(--celeste);
        border-radius:999px;padding:8px 15px;white-space:nowrap}
  .chip--rosa{background:var(--rosa-palo);color:var(--rosa-sombra)}
  .foto{position:relative;overflow:hidden;background:var(--celeste)}
  .foto img{width:100%;height:100%;object-fit:cover;object-position:43% 26%}
  .mar{position:absolute;left:0;right:0;bottom:0;height:78px}
</style></head><body>
<div class="card">
  <div class="txt">
    <img src="assets/img/logo.webp" alt="">
    <h1>Pediatría y nutrición<br>infantil en <em>Barranquilla</em></h1>
    <p class="sub">Consulta presencial y virtual, de recién nacido a la adolescencia.</p>
    <div class="chips">
      <span class="chip">Control pediátrico</span>
      <span class="chip">Nutrición infantil</span>
      <span class="chip chip--rosa">Consulta virtual</span>
    </div>
  </div>
  <div class="foto"><img src="assets/img/doctora-retrato.jpg" alt=""></div>
  <svg class="mar" viewBox="0 0 1200 78" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 40 C120 16 220 60 340 44 C460 28 540 62 660 48 C780 34 880 66 1000 50 C1090 38 1150 52 1200 44 L1200 78 L0 78 Z" fill="#BBD5EA" opacity=".55"/>
    <path d="M0 54 C130 34 230 70 350 58 C470 46 560 74 680 62 C800 50 900 76 1020 64 C1100 56 1160 66 1200 60 L1200 78 L0 78 Z" fill="#4A7BB5" opacity=".75"/>
    <path d="M0 66 C140 54 240 78 360 70 C480 62 580 82 700 74 C820 66 920 84 1040 76 C1120 70 1170 78 1200 74 L1200 78 L0 78 Z" fill="#2F4260"/>
  </svg>
</div></body></html>
