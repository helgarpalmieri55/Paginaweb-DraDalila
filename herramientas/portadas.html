<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="css/site.css">
<style>
  html,body{margin:0;background:#fff}
  .portada{width:1000px;height:1000px;position:relative;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center}
  .halo{position:absolute;top:50%;left:50%;width:680px;height:680px;transform:translate(-50%,-56%);
    border-radius:50%;background:rgba(255,255,255,.55)}
  .motivo{position:relative;width:560px;height:560px;margin-top:-40px}
  .motivo svg{width:100%;height:100%;display:block}
  .mar{position:absolute;left:0;right:0;bottom:0;height:150px}
  .sello{position:absolute;bottom:42px;left:50%;transform:translateX(-50%);width:230px;opacity:.9}
  .sello img{width:100%;display:block}
</style></head><body>

<!-- Cada portada: fondo de la paleta, halo suave, motivo dibujado a línea,
     una ola al pie para atarla al mundo del sitio y el logo pequeño. -->
<script>
const MAR = (a,b,c) => `
<svg class="mar" viewBox="0 0 1000 150" preserveAspectRatio="none" aria-hidden="true">
  <path d="M0 74 C120 44 220 96 340 78 C460 60 540 102 660 84 C780 66 880 108 1000 88 L1000 150 L0 150 Z" fill="${a}" opacity=".5"/>
  <path d="M0 96 C130 70 230 116 350 100 C470 84 560 122 680 106 C800 90 900 126 1000 110 L1000 150 L0 150 Z" fill="${b}" opacity=".65"/>
  <path d="M0 118 C140 100 240 132 360 120 C480 108 580 138 700 126 C820 114 920 140 1000 130 L1000 150 L0 150 Z" fill="${c}"/>
</svg>`;

// Trazo común: línea redondeada, sin relleno, como los iconos del sitio.
const T = 'fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"';

const MOTIVOS = {

  /* Lavado nasal: la jeringa de suero y sus gotas. */
  'lavado-nasal': (t,a) => `
    <svg viewBox="0 0 200 200">
      <g stroke="${t}" ${T}>
        <path d="M52 74h74c6 0 10 4 10 10v32c0 6-4 10-10 10H52z"/>
        <path d="M52 66v68"/>
        <path d="M52 100H26"/>
        <path d="M26 80v40"/>
        <path d="M136 100h20"/>
      </g>
      <g stroke="${t}" ${T} stroke-width="7" opacity=".4">
        <path d="M74 84v14"/><path d="M92 84v14"/><path d="M110 84v14"/>
      </g>
      <g fill="${a}">
        <path d="M172 90c0 5-3 8-7 8s-7-3-7-8 7-14 7-14 7 9 7 14z"/>
        <path d="M188 120c0 3-3 6-5 6s-5-3-5-6 5-12 5-12 5 9 5 12z"/>
        <path d="M164 132c0 3-2 5-4 5s-4-2-4-5 4-9 4-9 4 6 4 9z"/>
      </g>
    </svg>`,

  /* Sangrado de nariz: la gota y los diez minutos de presión. */
  'sangrado-nariz': (t,a) => `
    <svg viewBox="0 0 200 200">
      <path d="M78 26c0 0 38 48 38 74 0 21-17 38-38 38s-38-17-38-38c0-26 38-74 38-74z" fill="${a}"/>
      <g stroke="${t}" ${T}>
        <circle cx="150" cy="128" r="36"/>
        <path d="M150 104v24l17 11"/>
        <path d="M138 88h24"/>
        <path d="M150 88v-4"/>
      </g>
    </svg>`,

  /* Espasmo del sollozo: el pulso que se corta un momento y vuelve. */
  'espasmo-sollozo': (t,a) => `
    <svg viewBox="0 0 200 200">
      <path d="M100 176c-25-20-60-43-60-75 0-23 18-38 38-38 13 0 21 7 22 16 1-9 9-16 22-16 20 0 38 15 38 38 0 32-35 55-60 75z" stroke="${t}" ${T}/>
      <path d="M42 96h14l11-26 13 44 10-28h9" stroke="${a}" ${T}/>
      <path d="M99 96h26" stroke="${a}" ${T} stroke-dasharray="8 12" opacity=".5"/>
      <path d="M125 96h8l9-20 10 32 8-16h9" stroke="${a}" ${T}/>
    </svg>`,

  /* Ronquido: la almohada, los zzz y la noche que no descansa. */
  'ronquido': (t,a) => `
    <svg viewBox="0 0 200 200">
      <g stroke="${t}" ${T}>
        <path d="M26 156c0-16 13-28 29-28h90c16 0 29 12 29 28"/>
        <path d="M26 156h148"/>
        <path d="M62 128c0-20 16-36 36-36s36 16 36 36"/>
      </g>
      <g stroke="${a}" ${T}>
        <path d="M118 32h30l-30 30h30"/>
        <path d="M156 70h22l-22 22h22" stroke-width="7"/>
      </g>
    </svg>`,

  /* Dolor de oído a medianoche: la oreja y la luna. */
  'dolor-de-oido': (t,a) => `
    <svg viewBox="0 0 200 200">
      <g stroke="${t}" ${T}>
        <path d="M122 40C92 32 62 54 62 92c0 27 15 39 15 58 0 13 11 22 24 22 12 0 19-9 19-21"/>
        <path d="M106 76c-15 0-22 13-22 26 0 13 9 20 18 15 7-3 7-13 1-16"/>
      </g>
      <path d="M158 34a26 26 0 1 0 14 48 32 32 0 0 1-14-48z" fill="${a}"/>
      <g fill="${a}" opacity=".7">
        <circle cx="146" cy="96" r="5"/><circle cx="176" cy="112" r="4"/>
      </g>
    </svg>`,

  /* El inhalador: el frasco, la cámara y la mascarilla. */
  'inhalador': (t,a) => `
    <svg viewBox="0 0 200 200">
      <g stroke="${t}" ${T}>
        <rect x="30" y="52" width="34" height="52" rx="12"/>
        <path d="M47 52V34"/>
        <path d="M64 78h22c8 0 14 6 14 14v16"/>
        <path d="M100 92h26c10 0 18 8 18 18v22c0 10-8 18-18 18h-26c-10 0-18-8-18-18v-22c0-10 8-18 18-18z"/>
        <path d="M144 106c14 0 24 10 24 24s-10 24-24 24"/>
      </g>
      <g fill="${a}" opacity=".8">
        <circle cx="112" cy="121" r="6"/><circle cx="130" cy="134" r="4"/><circle cx="106" cy="140" r="4"/>
      </g>
    </svg>`,

  /* Bullying: lo que se dice y el silencio que queda. */
  'bullying': (t,a) => `
    <svg viewBox="0 0 200 200">
      <g stroke="${t}" ${T}>
        <path d="M28 40h72c9 0 16 7 16 16v34c0 9-7 16-16 16H56l-18 18v-18h-10c-9 0-16-7-16-16V56c0-9 7-16 16-16z"/>
        <path d="M46 62h36"/><path d="M46 80h24"/>
      </g>
      <g stroke="${t}" ${T} stroke-dasharray="14 12" opacity=".55">
        <path d="M172 96h-56c-9 0-16 7-16 16v26c0 9 7 16 16 16h32l18 18v-18h6c9 0 16-7 16-16v-26c0-9-7-16-16-16z"/>
      </g>
      <g fill="${a}">
        <circle cx="128" cy="126" r="6"/><circle cx="148" cy="126" r="6"/><circle cx="168" cy="126" r="6"/>
      </g>
    </svg>`,

  /* Después de los dos años: dos tazas, y no más de eso. */
  'leche-dos-anios': (t,a) => `
    <svg viewBox="0 0 200 200">
      <g stroke="${t}" ${T}>
        <path d="M34 64h58l-8 96c-1 9-8 16-17 16H59c-9 0-16-7-16-16z"/>
        <path d="M108 64h58l-8 96c-1 9-8 16-17 16h-8c-9 0-16-7-16-16z"/>
        <path d="M38 102h50"/><path d="M112 102h50"/>
      </g>
      <g fill="${a}">
        <path d="M40 106h46l-6 54c-1 6-5 10-11 10H62c-6 0-11-4-11-10z"/>
        <path d="M114 106h46l-6 54c-1 6-5 10-11 10h-8c-6 0-11-4-11-10z"/>
      </g>
    </svg>`
};

const FONDOS = {
  'lavado-nasal':    {bg:'#DCE9F5', tinta:'#2F4260', acento:'#4A7BB5', olas:['#BBD5EA','#8FB6DB','#4A7BB5']},
  'sangrado-nariz':  {bg:'#F3E3EA', tinta:'#2F4260', acento:'#E2557E', olas:['#EFAFC3','#E2557E','#B93C61']},
  'espasmo-sollozo': {bg:'#CFE4DF', tinta:'#2F4260', acento:'#E2557E', olas:['#BBD5EA','#8FB6DB','#4A7BB5']},
  'ronquido':        {bg:'#BBD5EA', tinta:'#2F4260', acento:'#4A7BB5', olas:['#A8C8E4','#7FAAD4','#2F4260']},
  'dolor-de-oido':   {bg:'#E2F0DE', tinta:'#2F4260', acento:'#D9A24F', olas:['#CFE4DF','#9CC6BC','#4E9E55']},
  'inhalador':       {bg:'#DCE9F5', tinta:'#2F4260', acento:'#4E9E55', olas:['#CFE4DF','#9CC6BC','#4A7BB5']},
  'bullying':        {bg:'#FFF8E9', tinta:'#2F4260', acento:'#D9A24F', olas:['#F0DEBE','#DCC08D','#D9A24F']},
  'leche-dos-anios': {bg:'#F3E3EA', tinta:'#2F4260', acento:'#FFFFFF', olas:['#DCE9F5','#BBD5EA','#4A7BB5']}
};

document.body.innerHTML = Object.keys(MOTIVOS).map(k => {
  const c = FONDOS[k];
  return `<div class="portada" id="p-${k}" style="background:${c.bg}">
    <div class="halo"></div>
    <div class="motivo">${MOTIVOS[k](c.tinta, c.acento)}</div>
    ${MAR(...c.olas)}
    <div class="sello"><img src="assets/img/logo.webp" alt=""></div>
  </div>`;
}).join('');
</script>
</body></html>
